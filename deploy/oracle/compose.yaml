name: railguard-oracle

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/oracle/backend.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      RAILGUARD_AI_ENABLED: ${RAILGUARD_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAILGUARD_AI_MODEL: ${RAILGUARD_AI_MODEL:-gpt-5.4-mini}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - runtime:/app/data/runtime
      - type: bind
        source: ../../data/ps3
        target: /app/data/ps3
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=2g,mode=1777
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 90s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/oracle/frontend.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      RAILGUARD_API_URL: http://backend:8000
    expose:
      - "3000"
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/caddy-entrypoint.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/oracle/.env}
      JUDGE_USER: ${JUDGE_USER:?Set JUDGE_USER in deploy/oracle/.env}
      JUDGE_PASSWORD_HASH: ${JUDGE_PASSWORD_HASH:?Set a single-quoted bcrypt hash in deploy/oracle/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/etc/caddy/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  runtime:
  caddy_data:
  caddy_config:
