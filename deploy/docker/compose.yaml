name: railguard

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      RAILGUARD_AI_ENABLED: ${RAILGUARD_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAILGUARD_AI_MODEL: ${RAILGUARD_AI_MODEL:-gpt-5.4-mini}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - runtime:/app/data/runtime
    tmpfs:
      - /tmp:size=2g,mode=1777
    # Published (not just exposed) so your existing reverse proxy, running
    # elsewhere on the LAN, can reach this container by the Docker VM's IP.
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 90s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      RAILGUARD_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

volumes:
  runtime:
